name: voxprint
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "202610032040"
    DEVELOPMENT_TEAM: QMM486NPYC
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"

targets:
  Voxprint-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "macOS/**"
      - path: BundledModels
        type: folder
        optional: true
      - path: Echo.icon
    preBuildScripts:
      - name: Fetch tiny model
        script: "\"$SRCROOT/scripts/fetch-tiny-model.sh\""
        basedOnDependencyAnalysis: false
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - target: EchoWatch
      - target: EchoKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.echo
        INFOPLIST_FILE: Sources/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/iOS/Echo.entitlements
        GENERATE_INFOPLIST_FILE: NO
        # Universal: iPad was never excluded for a design reason, only never enabled.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Echo
        PRODUCT_NAME: Echo

  Voxprint-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "iOS/**"
      - path: BundledModels
        type: folder
        optional: true
      - path: Echo.icon
    preBuildScripts:
      - name: Fetch tiny model
        script: "\"$SRCROOT/scripts/fetch-tiny-model.sh\""
        basedOnDependencyAnalysis: false
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        # Universal Purchase: macOS shares the iOS bundle id so both platforms live
        # under one App Store record (retiring the separate "Echo Transcribe Mac" record).
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.echo
        INFOPLIST_FILE: Sources/macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/macOS/voxprint-mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Echo
        PRODUCT_NAME: Echo
        PRODUCT_MODULE_NAME: Voxprint_macOS

  # v3.0: dictate into any app. The keyboard never records; Echo does, see Sources/Services/DictationBridge.swift.
  EchoKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Sources/Services/DictationBridge.swift
      - path: Sources/Services/Keychain.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.echo.keyboard
        PRODUCT_NAME: EchoKeyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Keyboard/EchoKeyboard.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES

  EchoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: watchos
        excludes:
          - "*.xcodeproj"
          - "*.xcodeproj/**"
          - "project.yml"
          - "Assets.xcassets/AppIcon.appiconset"
          - "Assets.xcassets/AppIcon.appiconset/**"
      - path: Echo.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.echo.watchkitapp
        PRODUCT_NAME: Echo
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Echo
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.nulljosh.echo
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Echo records on your watch and your iPhone writes it out on device. Your audio never goes to a server."
        ASSETCATALOG_COMPILER_APPICON_NAME: Echo
        SKIP_INSTALL: YES
  VoxprintTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Voxprint-macOS
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Echo.app/Contents/MacOS/Echo"
        BUNDLE_LOADER: "$(TEST_HOST)"
  VoxprintUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Voxprint-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.echo.uitests
        GENERATE_INFOPLIST_FILE: YES

  VoxprintMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests-mac
    dependencies:
      - target: Voxprint-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.echo.mac.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VoxprintTests:
    build:
      targets:
        Voxprint-macOS: all
        VoxprintTests: all
    test:
      targets:
        - VoxprintTests
    shared: true
  Voxprint-iOS:
    build:
      targets:
        Voxprint-iOS: all
    run:
      config: Debug
    archive:
      config: Release
    shared: true
  Voxprint-macOS:
    build:
      targets:
        Voxprint-macOS: all
    run:
      config: Debug
    archive:
      config: Release
    shared: true
  VoxprintUITests:
    build:
      targets:
        Voxprint-iOS: all
        VoxprintUITests: all
    test:
      # Screenshot runs are headless: attaching LLDB makes the app launch with
      # wait_for_debugger, and a broken debugger version store then denies the
      # launch outright (SBMainWorkspace RequestDenied).
      debugEnabled: false
      targets:
        - VoxprintUITests
    shared: true
  VoxprintMacUITests:
    build:
      targets:
        Voxprint-macOS: all
        VoxprintMacUITests: all
    test:
      targets:
        - VoxprintMacUITests
    shared: true
